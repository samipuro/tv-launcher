# Cosy Home settings for the Sony XR-65A80J. Keys left out keep the value in cosy.defaults.properties.
# After a change, rebuild and install: scripts\launcher-install.ps1

# Vantaa, from https://geocoding-api.open-meteo.com/v1/search?name=Vantaa&count=1
location.name=Vantaa
location.latitude=60.29
location.longitude=25.04

# Dock, in order: TV (Sony Live TV), Netflix, SmartTube, Spotify, F1 TV, Yle Areena, Ruutu. The grid starts with the same apps.
dock=com.sony.dtv.tvx,com.netflix.ninja,org.smarttube.stable,com.spotify.tv.android,com.formulaone.production,com.yle.webtv,com.thirdpresence.ruutu

# Next in the apps grid after the dock apps.
pinned=com.amazon.amazonvideo.livingroom,fi.mtvkatsomo,com.elisa.viihde.tv,com.disney.disneyplus,com.viaplay.android

# Never shown as tiles (still installed and working): the launcher itself, Calman for BRAVIA, Eco Dashboard,
# Recorded title list (recapp) and BRAVIA CORE (com.sonypicturescore).
hidden=com.cosyhome.tv,com.sony.dtv.calibrationmonitor,com.sony.dtv.ecodashboard,com.sony.dtv.recapp,com.sonypicturescore

# Sony apps for the Live TV and USB chips.
live_tv_package=com.sony.dtv.tvx
usb_package=com.sony.dtv.smartmediaapp

# No Ambilight on Sony: an empty value hides the chip.
ambilight_action=

# The remote's YouTube button sends keycode 196 (Sony global key); open SmartTube instead of official YouTube.
app_keys=196:org.smarttube.stable

# Home at every power-on, instead of the last app or input.
power_on_home=true
